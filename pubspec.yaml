name: saara
description: "Saara — a local-first personal integrity & productivity agent (Realmaya)."
publish_to: 'none'

# App version. See §7/§14 — free app, no billing.
version: 1.1.2+128

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # --- State management (§2) ---
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # --- Local DB: Drift (SQLite) + SQLCipher encryption (§2) ---
  drift: ^2.20.0
  # sqlcipher_flutter_libs bundles the SQLCipher-enabled sqlite3 native lib and
  # REPLACES sqlite3_flutter_libs (they share a namespace and cannot coexist).
  sqlcipher_flutter_libs: ^0.6.4
  sqlite3: ^2.4.6
  path_provider: ^2.1.4
  path: ^1.9.0

  # --- Secure key storage: Android Keystore / iOS Keychain (§2, DB key) ---
  flutter_secure_storage: ^9.2.2

  # --- Notifications: all reminders local (§2, §8) ---
  flutter_local_notifications: ^17.2.3
  timezone: ^0.9.4

  # --- Background work: WorkManager (Android) / BGTaskScheduler (§2, §8) ---
  # Deferred to Phase 2 when the nightly-rollover job is actually registered;
  # the old 0.5.x plugin doesn't compile against current Kotlin/AGP. Re-add a
  # current version (^0.9.x) with the job wiring then.

  # --- Date NLP (§2, §5, §6): chrono-style + custom grammar ---
  # Deterministic grammar is hand-rolled in domain/parser; this backs relative dates.
  # (any_date is optional; the parser degrades gracefully without it.)

  # --- Recurrence (§4 RRULE, §12 Todoist mapping) ---
  rrule: ^0.2.16

  # --- Task migration: import from a plain Excel/CSV file (offline) ---
  excel: ^4.0.6
  csv: ^6.0.0
  file_picker: ^8.1.2

  # --- Feedback mailto (§14) ---
  # Share-target text intake (§11) deferred to Phase 2 with the image/OCR path:
  # receive_sharing_intent 1.8 mandates compileSdk 37, whose platform isn't yet
  # publishable (only android-37.0 exists). Re-add when that settles.
  url_launcher: ^6.3.0

  # --- Calendar view of tasks (day/week/month) ---
  table_calendar: ^3.1.2

  # --- Image/screenshot → OCR → task (§11 image share-target, on-device) ---
  image_picker: ^1.1.2
  google_mlkit_text_recognition: ^0.14.0

  # --- Committed-listener report delivery via the user's own apps (§13) ---
  share_plus: ^10.1.2

  # --- Export all my data (§1.1): zip every table + capture media on-device ---
  archive: ^3.6.0

  # --- Tier 3 BYO-key AI: device→provider direct, key in Keystore (§6) ---
  http: ^1.2.2

  # --- On-device contacts for task participants (§5.3, §11; never uploaded) ---
  flutter_contacts: ^1.1.9+2

  # --- Google Tasks/Calendar sync (§9): sign-in + REST via http, device-direct ---
  # google_sign_in covers mobile; desktop uses the loopback + PKCE installed-app
  # flow in services/google/desktop_google_auth.dart (crypto = PKCE S256).
  google_sign_in: ^6.2.1
  crypto: ^3.0.3

  # --- Background periodic sync (§8): WorkManager (Android) ---
  workmanager: ^0.9.0+3

  # --- Voice capture (§19): on-device speech-to-text ---
  speech_to_text: ^7.0.0

  # --- Health Connect (§10): read steps/sleep/etc. to auto-score results ---
  health: ^12.2.0

  # --- Location & geofencing (§8): arrival prompts for located tasks ---
  geolocator: ^13.0.1
  geocoding: ^3.0.0
  native_geofence: ^1.1.1

  # --- Captures (§7.6): audio/video/image/text attached to a task ---
  # record 5.x drags in a stale record_linux (0.7.2) that can't compile against
  # a modern record_platform_interface, and it's pulled into the Android kernel
  # snapshot. 6.x ships a mutually-consistent federated set (record_linux 1.x /
  # interface 1.3.x). Our API surface (AudioRecorder/hasPermission/start/stop)
  # is unchanged across 5→6.
  record: ^6.0.0
  audioplayers: ^6.1.0
  video_player: ^2.9.2

  # --- Misc ---
  uuid: ^4.5.1
  collection: ^1.18.0
  intl: ^0.19.0
  package_info_plus: ^8.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # App-icon generation (§20.2). `image` draws the source mark; then
  # `flutter_launcher_icons` produces all Android/iOS sizes + adaptive icons.
  image: ^4.2.0
  flutter_launcher_icons: ^0.14.1

  # Drift + Riverpod code generation (run: dart run build_runner build)
  drift_dev: ^2.20.0
  build_runner: ^2.4.13
  riverpod_generator: ^2.6.1

# §20.2 launcher icon (brand mark, original — no resemblance to other assistant
# logos). Source images are generated by tool/gen_icon.dart.
flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: "assets/icon/ic_launcher.png"
  adaptive_icon_background: "#CC1A1A" # Realmaya brand red (§20.1)
  adaptive_icon_foreground: "assets/icon/ic_foreground.png"
  # Desktop uses the *same* source mark, so mobile and desktop can never drift
  # apart — one brand, one icon (§20.1/§20.2).
  windows:
    generate: true
    image_path: "assets/icon/ic_launcher.png"
    icon_size: 256
  macos:
    generate: true
    image_path: "assets/icon/ic_launcher.png"

flutter:
  uses-material-design: true

  # No bundled runtime assets — the Home header mark is drawn in code
  # (lib/features/home/widgets/wholeness_header.dart). Saara avatars (§20.2)
  # will add an `assets:` block in a later phase.
